version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_naufald
    env_file:
      - .env
    ports:
      - "22082:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_naufald
    env_file:
      - .env
    ports:
      - "44082:80"
    depends_on:
      - db
    networks:
      - db_network

volumes:
  pgdata:

networks:
  db_network: